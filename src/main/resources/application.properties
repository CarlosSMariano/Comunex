spring.application.name=comunex
#Spring config properties
spring.config.import=optional:file:.env[.properties]

# JWT
app.jwt.private-key=${JWT_PRIVATE_KEY}
app.jwt.public-key=${JWT_PUBLIC_KEY}
#identifica quem emitiu o token
jwt.issuer=comunex-api
#define a validade em segundos
jwt.expiration-seconds=900

# Criptografia AES
app.crypto.secret-key=${AES_SECRET_KEY}

# Oracle DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Flayway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Application
 app.frontend-url=${FRONTEND_URL}

logging.level.org.springframework.security=TRACE